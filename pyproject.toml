[project]
name = "ghost-marks-in-the-machine"
version = "0.1.0"
description = "Watermark detection project for AI-generated text"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "transformers",
    "huggingface-hub",
    "python-dotenv",
    "scikit-learn",
    "flask>=3.1.2",
    "flask-cors>=6.0.2",
]

[project.optional-dependencies]
jax = ["flax", "jax", "jaxlib", "optax", "jaxtyping"]
reporting = ["jinja2>=3.1.0", "pandas"]
training = ["accelerate", "datasets<3.0.0", "astor"]
nlp = ["click", "matplotlib", "nltk", "seaborn", "tqdm"]
dev = ["ghost-marks-in-the-machine[jax,reporting,training,nlp]"]
